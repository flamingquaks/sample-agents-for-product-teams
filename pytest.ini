[pytest]
# The fleet keeps tests in per-package `tests/` directories under both
# `agents/<name>/tests/` and `infra/dispatch/tests/`. Those directories used to
# carry `__init__.py`, which made every one resolve to the same top-level
# package name `tests` — so a single `pytest` run from the repo root collided on
# import and silently errored out the entire infra/dispatch suite.
#
# `importlib` import mode loads each test module by file path without requiring
# a unique package name, so the same-named `tests/` dirs no longer collide. Test
# modules add their target package to sys.path themselves (sys.path.insert at the
# top of each file), so no rootdir/src layout is assumed here.
addopts = --import-mode=importlib
testpaths =
    agents
    infra
python_files = test_*.py
