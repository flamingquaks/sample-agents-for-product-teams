AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SDLC Agent Fleet — Phase 0 shared infrastructure.
  DynamoDB, S3, Dispatch Router, Asana Webhook Receiver, IAM, CloudWatch.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  WorkitemsBotGID:
    Type: String
    Description: Asana user GID for the Workitems bot account

  AgentFieldGID:
    Type: String
    Description: Asana custom field GID for the "Agent" dropdown

  DeployDashboard:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Opt-in flag for the fleet monitoring dashboard. When "true", provisions
      the Cognito user pool, the operator-authorized read API (query Lambda),
      and the CloudFront-hosted SPA. Default "false" so existing deploys are
      unaffected until an operator opts in.

  DeployGateway:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Opt-in flag for the AgentCore Gateway + Cedar policy engine (the
      deterministic tool-call boundary that complements the dispatch allowlist).
      When "true", provisions the policy engine, the initial fleet Cedar policy,
      the Gateway (MCP, AWS_IAM inbound), and the GitHub/Asana MCP targets, and
      grants the admin Lambda permission to sync the fleet policy. Default
      "false" so the migration is rolled out deliberately (log-only first — see
      GatewayPolicyEnforcement). Requires DeployDashboard=true (the admin API
      owns the policy sync).

  GatewayPolicyEnforcement:
    Type: String
    Default: "LOG_ONLY"
    AllowedValues: ["LOG_ONLY", "ACTIVE"]
    Description: >
      Per-policy enforcement mode for the fleet Cedar policy. LOG_ONLY (default)
      logs deny decisions without blocking, so an operator can watch CloudWatch
      before flipping to ACTIVE. Applied to both the initial CFN policy and the
      admin Lambda's runtime policy sync (via FLEET_POLICY_ENFORCEMENT).

  AsanaMcpEndpoint:
    Type: String
    Default: "https://mcp.asana.com/v2/mcp"
    Description: Asana MCP server endpoint registered as a gateway target.

  GitHubAppName:
    Type: String
    Default: "SDLC Agent Fleet"
    Description: >
      Display name used when registering the fleet's GitHub App from the admin
      UI manifest flow. Must be unique across GitHub.

Conditions:
  DashboardEnabled: !Equals [!Ref DeployDashboard, "true"]
  GatewayEnabled: !Equals [!Ref DeployGateway, "true"]
  # GatewayPolicyEnforcement is expressed in per-policy terms (LOG_ONLY|ACTIVE);
  # the gateway→engine attachment Mode instead uses LOG_ONLY|ENFORCE. This maps
  # the ACTIVE choice to the attachment's ENFORCE value (see FleetGateway).
  GatewayEnforceActive: !Equals [!Ref GatewayPolicyEnforcement, "ACTIVE"]

Rules:
  # The admin Lambda (gated on DeployDashboard) is the ONLY component that
  # authors/syncs the fleet Cedar policy. Deploying the gateway without it would
  # create an enforcing policy engine with no way to ever populate its policies —
  # in ACTIVE mode that default-denies every agent tool call fleet-wide. Fail
  # fast at deploy instead of shipping a silently-broken stack.
  GatewayRequiresDashboard:
    RuleCondition: !Equals [!Ref DeployGateway, "true"]
    Assertions:
      - Assert: !Equals [!Ref DeployDashboard, "true"]
        AssertDescription: >-
          DeployGateway=true requires DeployDashboard=true — the admin API owns
          the Gateway Cedar policy sync.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB — Assignment Tracking
  # ---------------------------------------------------------------------------

  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub dispatch-assignments-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: assignment_id
          AttributeType: S
        - AttributeName: agent_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: source
          AttributeType: S
        - AttributeName: created_at
          AttributeType: "N"
        # Constant-value PK ("run") for the fleet-wide "all runs, newest-first"
        # index the monitoring dashboard pages. See AllRunsIndex below.
        - AttributeName: gsi_all
          AttributeType: S
      KeySchema:
        - AttributeName: assignment_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: agent_id-status-index
          KeySchema:
            - AttributeName: agent_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: source-created_at-index
          KeySchema:
            - AttributeName: source
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Fleet-wide time-ordered index for the monitoring dashboard. All items
        # share the constant PK gsi_all="run", sorted by created_at, so the
        # dashboard Querys the whole fleet newest-first in one call instead of a
        # scatter-gather across agent/source partitions. Single-partition write
        # concentration is acceptable at sample volume; a sharded PK
        # (run#<0..N>) is the documented scale follow-up. The GSI is sparse —
        # only items written with gsi_all (i.e. post-this-change dispatches)
        # appear; pre-existing rows are absent by design.
        - IndexName: AllRunsIndex
          KeySchema:
            - AttributeName: gsi_all
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: sdlc-agents

  # ---------------------------------------------------------------------------
  # DynamoDB — Fleet Configuration (runtime-mutable: onboarded repos + settings)
  # ---------------------------------------------------------------------------
  # The admin API writes this; the Dispatch Router reads it to decide which
  # repos may dispatch (multi-repo allowlist). Unconditional — the router needs
  # it even when the dashboard UI isn't deployed. Replaces the deploy-time
  # FLEET_GITHUB_REPO parameter. Small item count (a handful of repos + one
  # settings row), no TTL (config is not ephemeral).

  FleetConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub fleet-config-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: sdlc-agents

  # ---------------------------------------------------------------------------
  # GitHub App credentials — the fleet's ONLY GitHub credential model (the shared
  # PAT was retired). Created empty; populated by the admin manifest flow. Private
  # key → Secrets Manager (rotation, resource policy, staged versions); app id +
  # slug → SSM String (not secret). See docs/specs/github-onboarding-spec.md §3.2.
  #
  # UNCONDITIONAL (not DashboardEnabled-gated): the agent runtimes and the
  # always-on dispatch reply Lambda mint per-owner installation tokens from these
  # resources, so they must exist whether or not the dashboard is deployed. Only
  # REGISTERING/populating the App (the manifest flow) lives in the opt-in
  # dashboard — deploying the dashboard once is the documented prerequisite to
  # actually use GitHub (like the manual GitHub-App registration step itself).
  # ---------------------------------------------------------------------------

  GitHubAppPrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub sdlc-agents/${Stage}/github-app/private-key
      Description: GitHub App private key (PEM) — written by the admin manifest flow
      Tags:
        - Key: Project
          Value: sdlc-agents

  GitHubAppIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlc-agents/${Stage}/github-app-id
      Type: String
      # Placeholder until the manifest flow overwrites it; SSM has no empty value.
      Value: "unset"
      Description: GitHub App ID (populated by the admin manifest flow)

  GitHubAppSlugParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlc-agents/${Stage}/github-app-slug
      Type: String
      Value: "unset"
      Description: GitHub App slug (drives the install deep-link)

  # ---------------------------------------------------------------------------
  # S3 — Agent Artifacts
  # ---------------------------------------------------------------------------

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sdlc-agent-access-logs-${AWS::AccountId}-${Stage}
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: 90
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: sdlc-agents

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AccessLogsBucket.Arn}/*
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub arn:aws:s3:::sdlc-agent-artifacts-${AWS::AccountId}-${Stage}
              StringEquals:
                "aws:SourceAccount": !Sub ${AWS::AccountId}

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sdlc-agent-artifacts-${AWS::AccountId}-${Stage}
      LifecycleConfiguration:
        Rules:
          - Id: expire-screenshots
            Prefix: screenshots/
            Status: Enabled
            ExpirationInDays: 90
          - Id: expire-test-results
            Prefix: test-results/
            Status: Enabled
            ExpirationInDays: 180
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: artifacts/
      Tags:
        - Key: Project
          Value: sdlc-agents

  # ---------------------------------------------------------------------------
  # Shared DLQ for async Lambda failures
  # ---------------------------------------------------------------------------

  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sdlc-agents-lambda-dlq-${Stage}
      MessageRetentionPeriod: 1209600  # 14 days
      SqsManagedSseEnabled: true

  # ---------------------------------------------------------------------------
  # Dispatch Router Lambda
  # ---------------------------------------------------------------------------

  DispatchRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub dispatch-router-${Stage}
      CodeUri: ../dispatch/
      Handler: router.handler
      Timeout: 900
      ReservedConcurrentExecutions: 20
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          ASSIGNMENTS_TABLE: !Ref AssignmentsTable
          REGISTRY_PARAM: !Sub /sdlc-agents/${Stage}/registry
          BEDROCK_GUARDRAIL_ID: !Ref PromptInjectionGuardrail
          BEDROCK_GUARDRAIL_VERSION: DRAFT
          ASANA_PAT_PARAM: /sdlc-agents/asana-pat
          CLOUDWATCH_NAMESPACE: SDLCAgents/Dispatch
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          # reply.py mints per-owner GitHub App installation tokens (the shared
          # PAT was retired). The App id param + key secret ARN are unconditional
          # resources; the per-owner install record it reads lives in the
          # fleet-config table (DynamoDBReadPolicy below). Registering the App
          # (populating these) is a dashboard-only step — a documented prereq.
          GITHUB_APP_ID_PARAM: !Ref GitHubAppIdParam
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AssignmentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FleetConfigTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub sdlc-agents/${Stage}/registry
        # GitHub App (reply.py): read the App private key + app-id to mint
        # per-owner installation tokens (the shared PAT was retired). The App
        # credential resources are unconditional; the per-owner install record
        # read is already covered by DynamoDBReadPolicy on FleetConfigTable above.
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubAppPrivateKey
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/github-app-id
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*
                - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource:
                - !GetAtt PromptInjectionGuardrail.GuardrailArn
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/asana-pat
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: SDLCAgents/Dispatch

  # ---------------------------------------------------------------------------
  # Asana Webhook Receiver Lambda + API Gateway
  # ---------------------------------------------------------------------------

  AsanaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub asana-webhook-${Stage}
      CodeUri: ../dispatch/
      Handler: asana_webhook.handler
      Timeout: 30
      ReservedConcurrentExecutions: 10
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          ASANA_PAT_PARAM: /sdlc-agents/asana-pat
          ASANA_WEBHOOK_SECRET_PARAM: /sdlc-agents/asana-webhook-secret
          DISPATCH_FUNCTION: !Ref DispatchRouterFunction
          WORKITEMS_BOT_GID: !Ref WorkitemsBotGID
          AGENT_FIELD_GID: !Ref AgentFieldGID
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DispatchRouterFunction
        - Statement:
            # Steady-state permissions: read the Asana PAT and the webhook
            # secret to verify inbound HMAC signatures. ssm:PutParameter is
            # intentionally NOT granted here — the Asana handshake captures
            # the webhook secret, and a Lambda that can overwrite it in
            # steady state is a path an attacker can abuse to replace the
            # secret with attacker-controlled bytes (threat T-9).
            #
            # The operator runs scripts/bootstrap_asana_webhook.py, which
            # attaches a temporary inline ssm:PutParameter policy for the
            # registration window, registers the webhook with Asana, waits
            # for the handshake to land, and then detaches the policy.
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/asana-pat
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/asana-webhook-secret
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /asana/webhook
            Method: POST
            RestApiId: !Ref WebhookApi

  WebhookApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/sdlc-agents-webhook-${Stage}
      RetentionInDays: 30

  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Description: Asana webhook endpoint for agent dispatch
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt WebhookApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength"}

  # ---------------------------------------------------------------------------
  # SSM — Agent Registry Parameter
  # ---------------------------------------------------------------------------

  RegistryParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlc-agents/${Stage}/registry
      Type: String
      Description: Agent fleet registry (rendered from capability rows by the dashboard admin API)
      Value: "{}"  # Populated by the dashboard admin API on every capability change

  # ---------------------------------------------------------------------------
  # Bedrock Guardrail — Prompt Injection Defense (T-1, T-2, T-3)
  # ---------------------------------------------------------------------------
  # A single guardrail is shared by the Dispatch Router edge check and every
  # agent's model invocation. Only the prompt-attack filter is enabled —
  # content / PII / word filters are intentionally out of scope for this
  # feature. InputStrength is MEDIUM (HIGH produced too many false positives
  # against the Dispatch Context wrapper — see commit 4f91498); OutputStrength
  # is NONE because agent outputs go through structural controls (Cedar
  # roadmap + no destructive tools) rather than content filtering.

  PromptInjectionGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub sdlc-agents-prompt-injection-${Stage}
      Description: Prompt-attack defense for SDLC agent fleet (T-1, T-2, T-3)
      BlockedInputMessaging: "This request was blocked by a prompt-injection safety filter."
      BlockedOutputsMessaging: "The agent's response was blocked by a prompt-injection safety filter."
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: MEDIUM
            OutputStrength: NONE

  # ---------------------------------------------------------------------------
  # CloudWatch — Observability
  # ---------------------------------------------------------------------------

  DispatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dispatch-router-errors-${Stage}
      AlarmDescription: Dispatch Router error rate > 5%
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatchRouterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub asana-webhook-errors-${Stage}
      AlarmDescription: Asana webhook receiver error rate
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AsanaWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DispatchDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dispatch-router-duration-${Stage}
      AlarmDescription: Dispatch Router taking too long
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatchRouterFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 30000  # 30 seconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  GuardrailTrippedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dispatch-guardrail-tripped-${Stage}
      AlarmDescription: High rate of prompt-injection trips — potential attack or false-positive spike
      Namespace: SDLCAgents/Dispatch
      MetricName: GuardrailTripped
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  GuardrailErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dispatch-guardrail-error-${Stage}
      AlarmDescription: Bedrock ApplyGuardrail API errors — fail-closed bypass risk
      Namespace: SDLCAgents/Dispatch
      MetricName: GuardrailError
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  GuardrailReplyFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub dispatch-guardrail-reply-failed-${Stage}
      AlarmDescription: Blocked-message reply failed to post to source thread
      Namespace: SDLCAgents/Dispatch
      MetricName: GuardrailReplyFailed
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ===========================================================================
  # Fleet Monitoring Dashboard (opt-in: DeployDashboard=true)
  # ===========================================================================
  # Cross-user, read-only view over the assignments table. All resources below
  # are gated on the DashboardEnabled condition so a default deploy provisions
  # none of them. The CloudFront-hosted SPA is added in a later change; this
  # block provides the identity (Cognito) + the operator-authorized query API.

  # --- Cognito: operator identity for the dashboard --------------------------

  DashboardUserPool:
    Type: AWS::Cognito::UserPool
    Condition: DashboardEnabled
    Properties:
      UserPoolName: !Sub sdlc-agents-dashboard-${Stage}
      # Operators are provisioned by an admin (no open sign-up) — the dashboard
      # exposes fleet-wide activity and must not be self-service.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  # Members of this group pass the operator check in dashboard/auth.py
  # (OPERATOR_GROUP = "operators"). Membership is an explicit admin action.
  DashboardOperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: DashboardEnabled
    Properties:
      GroupName: operators
      Description: Operators authorized to view fleet-wide agent activity
      UserPoolId: !Ref DashboardUserPool

  # admins additionally configure the fleet (onboard repos, restriction
  # settings) through the write API. Membership is an explicit admin action.
  DashboardAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: DashboardEnabled
    Properties:
      GroupName: admins
      Description: Admins authorized to configure the fleet (onboard repos, restrictions)
      UserPoolId: !Ref DashboardUserPool

  DashboardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: DashboardEnabled
    Properties:
      ClientName: !Sub sdlc-agents-dashboard-spa-${Stage}
      UserPoolId: !Ref DashboardUserPool
      # Public SPA client: no secret, Authorization Code + PKCE via Hosted UI.
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      # The CloudFront URL is the real operator entry point; localhost is kept so
      # the SPA can run against a real pool during development. Trailing slash
      # matches the SPA's redirectUri (origin + base path).
      CallbackURLs:
        - http://localhost:5173/
        - !Sub https://${DashboardDistribution.DomainName}/
      LogoutURLs:
        - http://localhost:5173/
        - !Sub https://${DashboardDistribution.DomainName}/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  DashboardUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: DashboardEnabled
    Properties:
      # Hosted-UI login domain. Includes the account id to keep the prefix
      # globally unique.
      Domain: !Sub sdlc-agents-dash-${AWS::AccountId}-${Stage}
      UserPoolId: !Ref DashboardUserPool

  # --- Query API -------------------------------------------------------------

  DashboardApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Condition: DashboardEnabled
    Properties:
      LogGroupName: !Sub /aws/apigateway/sdlc-agents-dashboard-${Stage}
      RetentionInDays: 30

  DashboardApi:
    Type: AWS::Serverless::Api
    Condition: DashboardEnabled
    Properties:
      StageName: !Ref Stage
      Description: Operator-authorized read API for the fleet monitoring dashboard
      TracingEnabled: true
      # Every method is authorized by the Cognito user pool by default; the
      # Lambda additionally enforces operator-group membership.
      Auth:
        DefaultAuthorizer: CognitoOperators
        Authorizers:
          CognitoOperators:
            UserPoolArn: !GetAtt DashboardUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowOrigin: "'*'"
      AccessLogSetting:
        DestinationArn: !GetAtt DashboardApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength"}

  # CORS on authorizer-rejected / error responses. When the Cognito authorizer
  # rejects a request (401 on a missing/invalid/EXPIRED token, 403), or a 5xx
  # occurs, API Gateway returns a default GatewayResponse that carries no
  # Access-Control-Allow-Origin — so the browser SPA can't read the status/body
  # and sees an opaque CORS error instead of a clean "session expired → log in
  # again" signal. These echo the CORS header onto those responses. (The SAM
  # Cors block only covers the OPTIONS preflight and Lambda-origin responses.)
  DashboardGatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Condition: DashboardEnabled
    Properties:
      RestApiId: !Ref DashboardApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  DashboardGatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Condition: DashboardEnabled
    Properties:
      RestApiId: !Ref DashboardApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  DashboardQueryFunction:
    Type: AWS::Serverless::Function
    Condition: DashboardEnabled
    Properties:
      FunctionName: !Sub dashboard-query-${Stage}
      CodeUri: ../dashboard/
      Handler: api.handler
      Timeout: 30
      # No ReservedConcurrentExecutions: this is a low-traffic, operator-only
      # read path. Reserving a slice would (a) give it a guarantee it doesn't
      # need and (b) count against the account concurrency floor alongside the
      # router/webhook reservations — and we never want dashboard reads to be
      # able to starve dispatch. Let it draw from the unreserved pool.
      Environment:
        Variables:
          ASSIGNMENTS_TABLE: !Ref AssignmentsTable
      Policies:
        # Read-only: GetItem on the table + Query on its indexes (the dashboard
        # never writes). DynamoDBReadPolicy covers GetItem/Query/Scan and the
        # table's index/* ARNs.
        - DynamoDBReadPolicy:
            TableName: !Ref AssignmentsTable
      Events:
        ListRuns:
          Type: Api
          Properties:
            Path: /runs
            Method: GET
            RestApiId: !Ref DashboardApi
        GetRun:
          Type: Api
          Properties:
            Path: /runs/{assignment_id}
            Method: GET
            RestApiId: !Ref DashboardApi
        Trace:
          Type: Api
          Properties:
            Path: /trace
            Method: GET
            RestApiId: !Ref DashboardApi
        Stats:
          Type: Api
          Properties:
            Path: /stats
            Method: GET
            RestApiId: !Ref DashboardApi

  # --- Admin write API: fleet configuration (repos + settings) ---------------
  # Separate function from the read-only query fn so its write IAM (CRUD on the
  # config table) doesn't broaden the read path. Admin-group enforcement is in
  # admin.py (auth.is_admin); the Cognito authorizer on DashboardApi still
  # validates the JWT for these routes too.

  DashboardAdminFunction:
    Type: AWS::Serverless::Function
    Condition: DashboardEnabled
    # cryptography (used by github_client to sign App JWTs) is a native/cffi
    # wheel, so it must be built for the Lambda target, not the build host. The
    # python3.12 build method makes `sam build` resolve manylinux wheels for the
    # function's runtime/architecture — without it, a build on macOS/arm64
    # bundles an unloadable .so and every App-mode admin route fails at import.
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub dashboard-admin-${Stage}
      CodeUri: ../dashboard/
      Handler: admin.handler
      Timeout: 60
      Environment:
        Variables:
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          # When the gateway is deployed, the admin Lambda syncs the fleet Cedar
          # policy on every repo/settings change. Unset otherwise → policy_sync
          # is a logged no-op and only the dispatch allowlist is affected.
          POLICY_ENGINE_ID: !If [GatewayEnabled, !GetAtt FleetPolicyEngine.PolicyEngineId, !Ref "AWS::NoValue"]
          # Whether the gateway is actually enforcing (ACTIVE) vs LOG_ONLY. Drives
          # whether a policy-sync failure fails onboarding: enforcing → fail
          # (avoid dispatch widening ahead of a denying policy); log-only → the
          # policy blocks nothing, so onboarding succeeds and re-syncs later.
          GATEWAY_ENFORCEMENT: !If [GatewayEnabled, !Ref GatewayPolicyEnforcement, !Ref "AWS::NoValue"]
          # Gateway ARN + account for the per-agent permit policies (principals
          # are the agents' runtime-role ARNs, resource is the literal gateway).
          FLEET_GATEWAY_ARN: !If [GatewayEnabled, !GetAtt FleetGateway.GatewayArn, !Ref "AWS::NoValue"]
          AWS_ACCOUNT_ID: !If [GatewayEnabled, !Ref "AWS::AccountId", !Ref "AWS::NoValue"]
          # GitHub App: onboarding verification + manifest flow. Onboarding
          # ALWAYS verifies the App is installed on a repo's owner and can reach
          # the repo before activating it (the PAT path was retired).
          GITHUB_APP_NAME: !Ref GitHubAppName
          GITHUB_APP_ID_PARAM: !Ref GitHubAppIdParam
          GITHUB_APP_SLUG_PARAM: !Ref GitHubAppSlugParam
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKey
          DASHBOARD_URL: !Sub https://${DashboardDistribution.DomainName}/
          # The admin Lambda renders the Dispatch Router registry from the
          # capability rows and writes it here on every capability change — the
          # same parameter the router reads (RegistryParameter / DispatchRouter's
          # REGISTRY_PARAM). This replaces scripts/sync_registry.py's deploy-time sync.
          REGISTRY_PARAM: !Sub /sdlc-agents/${Stage}/registry
          # The single shared build pipeline the admin API triggers on a
          # capability onboard/edit (codebuild:StartBuild only — never runtime/role
          # creation, which is the deployer Lambda's job off the build event).
          CAPABILITY_BUILD_PROJECT: !Ref CapabilityBuildProject
      Policies:
        # Read+write the config table (onboard/enable/disable repos, settings,
        # capabilities).
        - DynamoDBCrudPolicy:
            TableName: !Ref FleetConfigTable
        # Publish the rendered agent registry to the SSM param the Dispatch Router
        # reads (capability onboard/edit/disable regenerates it).
        - Statement:
            - Effect: Allow
              Action: ssm:PutParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/registry
        # Trigger the shared agent build pipeline on a capability onboard/edit.
        # StartBuild ONLY, and only on the single fleet build project — the admin
        # API deliberately holds NO IAM-role or runtime-creation privilege (those
        # live on the CapabilityDeployerFunction, reachable only via the build
        # completion event, not any HTTP path).
        - Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt CapabilityBuildProject.Arn
        # GitHub App: read app id/slug + read/write the private key + update the
        # id/slug params after the manifest flow creates the App.
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Ref GitHubAppPrivateKey
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/github-app-id
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/github-app-slug
        # Sync the fleet Cedar policy to the engine (gateway deploys only).
        - !If
          - GatewayEnabled
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreatePolicy
                  - bedrock-agentcore:UpdatePolicy
                  - bedrock-agentcore:GetPolicy
                  - bedrock-agentcore:ListPolicies
                Resource:
                  - !GetAtt FleetPolicyEngine.PolicyEngineArn
                  - !Sub ${FleetPolicyEngine.PolicyEngineArn}/*
              # CreatePolicy/UpdatePolicy attach a resource-scoped policy to the
              # gateway, which the service authorizes as ManageResourceScopedPolicy
              # against the GATEWAY resource (not the engine) — without this,
              # CreatePolicy fails AccessDenied even with the engine actions above.
              # The admin function is not the gateway's RoleArn, so referencing the
              # gateway ARN here is not a dependency cycle (unlike the gateway role).
              - Effect: Allow
                Action: bedrock-agentcore:ManageResourceScopedPolicy
                Resource:
                  - !GetAtt FleetGateway.GatewayArn
          - !Ref "AWS::NoValue"
      Events:
        ListRepos:
          Type: Api
          Properties:
            Path: /admin/repos
            Method: GET
            RestApiId: !Ref DashboardApi
        OnboardRepo:
          Type: Api
          Properties:
            Path: /admin/repos
            Method: POST
            RestApiId: !Ref DashboardApi
        DeleteRepo:
          Type: Api
          Properties:
            # Greedy {repo+} so an owner/repo value (which contains a slash) is
            # captured as one path parameter. A plain {repo} matches only a
            # single path segment and would route-miss / 403 on "owner/repo".
            Path: /admin/repos/{repo+}
            Method: DELETE
            RestApiId: !Ref DashboardApi
        GetSettings:
          Type: Api
          Properties:
            Path: /admin/settings
            Method: GET
            RestApiId: !Ref DashboardApi
        PutSettings:
          Type: Api
          Properties:
            Path: /admin/settings
            Method: PUT
            RestApiId: !Ref DashboardApi
        ListCapabilities:
          Type: Api
          Properties:
            Path: /admin/capabilities
            Method: GET
            RestApiId: !Ref DashboardApi
        OnboardCapability:
          Type: Api
          Properties:
            Path: /admin/capabilities
            Method: POST
            RestApiId: !Ref DashboardApi
        DeleteCapability:
          Type: Api
          Properties:
            Path: /admin/capabilities/{agent_id}
            Method: DELETE
            RestApiId: !Ref DashboardApi
        GitHubAppStatus:
          Type: Api
          Properties:
            Path: /admin/github-app/status
            Method: GET
            RestApiId: !Ref DashboardApi
        GitHubAppManifest:
          Type: Api
          Properties:
            Path: /admin/github-app/setup/manifest
            Method: GET
            RestApiId: !Ref DashboardApi
        GitHubAppCallback:
          Type: Api
          Properties:
            Path: /admin/github-app/setup/callback
            Method: POST
            RestApiId: !Ref DashboardApi

  # ===========================================================================
  # Capability build pipeline + deployer (gated on DeployDashboard)
  # ===========================================================================
  # UI-driven agent onboarding: the admin API triggers ONE shared, agent-agnostic
  # CodeBuild project (parameterized by AGENT_NAME), which builds agents/<name>
  # and pushes to ECR. Build completion fires an EventBridge rule that invokes the
  # CapabilityDeployerFunction, which stands up / updates the AgentCore runtime.
  # The privileged actions (IAM role + runtime creation) live ONLY on the
  # deployer's role — reachable via the build event, never via the internet-facing
  # admin API. See infra/dashboard/capability_deployer.py.

  # Source the pipeline builds from. The thin base deploy (bootstrap) uploads the
  # fleet source (agents/ + shared/) here as source.zip; the build unpacks it and
  # builds the requested agent. Keeping the source in S3 (not a GitHub/CodeConnections
  # source) makes the pipeline self-contained in AWS — consistent with the UI-only,
  # no-OIDC model.
  CapabilitySourceBucket:
    Type: AWS::S3::Bucket
    Condition: DashboardEnabled
    Properties:
      BucketName: !Sub sdlc-agent-source-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      VersioningConfiguration:
        Status: Enabled

  # Permissions boundary that CAPS every per-agent runtime role the deployer
  # creates. Even a bug in capability_deployer._ensure_runtime_role can't grant a
  # runtime more than this — the effective permissions of a bounded role are the
  # INTERSECTION of its policies and this boundary. Scoped to exactly what an
  # agent runtime legitimately needs: pull its image, log, read/write the
  # assignments table, invoke the fleet gateway + Bedrock models.
  CapabilityRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: DashboardEnabled
    Properties:
      ManagedPolicyName: !Sub sdlc-capability-runtime-boundary-${Stage}
      Description: Permissions boundary capping SDLC capability runtime roles.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RuntimeMaxPermissions
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:GetAuthorizationToken
              - bedrock-agentcore:InvokeGateway
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ApplyGuardrail
            Resource: "*"

  CapabilityBuildRole:
    Type: AWS::IAM::Role
    Condition: DashboardEnabled
    Properties:
      RoleName: !Sub sdlc-capability-build-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/sdlc-agent-builder-${Stage}*
              - Sid: SourceRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${CapabilitySourceBucket.Arn}/*
              # ECR push for any sdlc-agents/<agent> repo. GetAuthorizationToken
              # is account-wide (no per-repo scoping possible); the mutating layer
              # actions are scoped to the fleet's own repo namespace.
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:PutImageScanningConfiguration
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/sdlc-agents/*

  # The single, agent-agnostic build project. AGENT_NAME (+ IMAGE_TAG) are passed
  # as environment overrides per StartBuild; the buildspec builds that one agent.
  # PrivilegedMode is required for the in-container docker build.
  CapabilityBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: DashboardEnabled
    Properties:
      Name: !Sub sdlc-agent-builder-${Stage}
      Description: Shared build pipeline for SDLC fleet agents (parameterized by AGENT_NAME).
      ServiceRole: !GetAtt CapabilityBuildRole.Arn
      TimeoutInMinutes: 30
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
          - { Name: ECR_REGISTRY, Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" }
          # Defaults; overridden per build by StartBuild. AGENT_NAME empty here so
          # a mis-triggered build with no override fails fast rather than building
          # a wrong agent.
          - { Name: AGENT_NAME, Value: "" }
          - { Name: IMAGE_TAG, Value: "latest" }
      Source:
        Type: S3
        Location: !Sub ${CapabilitySourceBucket}/source.zip
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - set -euo pipefail
                - test -n "$AGENT_NAME" || { echo "AGENT_NAME override is required"; exit 1; }
                - echo "$AGENT_NAME" | grep -Eq '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' || { echo "invalid AGENT_NAME"; exit 1; }
                - test -f "agents/$AGENT_NAME/Dockerfile" || { echo "no agents/$AGENT_NAME/Dockerfile in source"; exit 1; }
                - REPO="sdlc-agents/$AGENT_NAME"
                - aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$REPO" --image-scanning-configuration scanOnPush=true --image-tag-mutability IMMUTABLE
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            build:
              commands:
                # Build context is agents/ so the shared/ package is included
                # (matches how the agent images were always built).
                - docker build -f "agents/$AGENT_NAME/Dockerfile" -t "$ECR_REGISTRY/$REPO:$IMAGE_TAG" agents/
            post_build:
              commands:
                - docker push "$ECR_REGISTRY/$REPO:$IMAGE_TAG"

  # Deployer: build completion → stand up / update the AgentCore runtime. This is
  # the ONLY component holding iam:CreateRole/PassRole + create/update-agent-runtime,
  # and it is invocable only by the CodeBuild-completion rule below.
  CapabilityDeployerFunction:
    Type: AWS::Serverless::Function
    Condition: DashboardEnabled
    Properties:
      FunctionName: !Sub capability-deployer-${Stage}
      CodeUri: ../dashboard/
      Handler: capability_deployer.handler
      Timeout: 900
      Environment:
        Variables:
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          REGISTRY_PARAM: !Sub /sdlc-agents/${Stage}/registry
          STAGE: !Ref Stage
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          RUNTIME_PERMISSIONS_BOUNDARY_ARN: !Ref CapabilityRuntimeBoundary
          BEDROCK_GUARDRAIL_ID: !Ref PromptInjectionGuardrail
          BEDROCK_GUARDRAIL_VERSION: DRAFT
          GATEWAY_MCP_URL: !If [GatewayEnabled, !GetAtt FleetGateway.GatewayUrl, !Ref "AWS::NoValue"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FleetConfigTable
        - Statement:
            - Effect: Allow
              Action: ssm:PutParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/registry
            # Create + configure the per-agent runtime role — CONSTRAINED to the
            # fixed capabilities path, and CreateRole is further required to attach
            # the runtime permissions boundary (condition below), so a role made
            # here can never exceed the boundary.
            - Sid: CreateBoundedRuntimeRole
              Effect: Allow
              Action: iam:CreateRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sdlc-agents/capabilities/*
              Condition:
                StringEquals:
                  iam:PermissionsBoundary: !Ref CapabilityRuntimeBoundary
            - Sid: ConfigureRuntimeRole
              Effect: Allow
              Action:
                - iam:PutRolePolicy
                - iam:GetRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sdlc-agents/capabilities/*
            # AttachRolePolicy is split out and pinned to the ONE managed policy the
            # deployer attaches, so it can't attach an arbitrary (e.g. admin) policy.
            # The permissions boundary already caps effective permissions, but this
            # removes the unnecessary latitude.
            - Sid: AttachBedrockManagedPolicy
              Effect: Allow
              Action: iam:AttachRolePolicy
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sdlc-agents/capabilities/*
              Condition:
                ArnEquals:
                  iam:PolicyARN: arn:aws:iam::aws:policy/AmazonBedrockFullAccess
            # PassRole so create/update-agent-runtime can hand the runtime role to
            # the AgentCore service — scoped to the same path + service.
            - Sid: PassRuntimeRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sdlc-agents/capabilities/*
              Condition:
                StringEquals:
                  iam:PassedToService: bedrock-agentcore.amazonaws.com
            # Runtime lifecycle. list/get are account-wide (no resource scoping on
            # those APIs); create/update are the mutating ones the deployer runs.
            # list/get/tag-read are account-wide (those APIs don't take a resource
            # ARN); Create tags the runtime as fleet-managed and the deployer
            # refuses to Update any same-named runtime lacking that tag, so the
            # broad Resource can't be used to hijack a foreign runtime.
            - Sid: AgentCoreRuntime
              Effect: Allow
              Action:
                - bedrock-agentcore-control:CreateAgentRuntime
                - bedrock-agentcore-control:UpdateAgentRuntime
                - bedrock-agentcore-control:GetAgentRuntime
                - bedrock-agentcore-control:ListAgentRuntimes
                - bedrock-agentcore-control:ListTagsForResource
                - bedrock-agentcore-control:TagResource
              Resource: "*"
      Events:
        BuildCompleted:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.codebuild]
              detail-type: ["CodeBuild Build State Change"]
              detail:
                build-status: [SUCCEEDED, FAILED, STOPPED, FAULT, TIMED_OUT]
                project-name:
                  - !Sub sdlc-agent-builder-${Stage}

  # Weekly security rebuild: re-runs the shared build pipeline for every ACTIVE
  # capability so agent images pick up base-image + dependency security patches.
  # Only STARTS builds (StartBuild); the build-completion event drives the runtime
  # update through the deployer. A failed rebuild leaves the running agent on its
  # previous image (see config_store.render_registry — routability keys on a
  # working runtime, not on status), so this can never take an agent down.
  CapabilityRebuilderFunction:
    Type: AWS::Serverless::Function
    Condition: DashboardEnabled
    Properties:
      FunctionName: !Sub capability-rebuilder-${Stage}
      CodeUri: ../dashboard/
      Handler: capability_rebuilder.handler
      Timeout: 120
      Environment:
        Variables:
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          CAPABILITY_BUILD_PROJECT: !Ref CapabilityBuildProject
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FleetConfigTable
        - Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt CapabilityBuildProject.Arn
      Events:
        Weekly:
          Type: Schedule
          Properties:
            # Sundays 08:00 UTC — a low-traffic window; the rebuild is rolling
            # (per-agent builds) and non-disruptive, so exact timing isn't critical.
            Schedule: cron(0 8 ? * SUN *)
            Description: Weekly security rebuild of active SDLC agent containers

  # ===========================================================================
  # AgentCore Gateway + Cedar Policy Engine (opt-in: DeployGateway=true)
  # ===========================================================================
  # The deterministic tool-call boundary. Agents route MCP tool calls through
  # this Gateway (instead of direct-to-MCP); the attached policy engine enforces
  # Cedar policies — including the fleet repo-allowlist policy the admin Lambda
  # syncs (policy_sync.py). Native CFN resource types (verified available in
  # us-east-1/us-west-2). Rolled out log-only first (GatewayPolicyEnforcement):
  # an engine attached in LOG_ONLY logs deny decisions without blocking, so
  # agents keep working while permit policies are authored and observed before
  # the enforce flip.
  #
  # Deploy-time steps that require the LIVE gateway tool manifest (cannot be
  # modeled here — see docs/aws-deploy.md): authoring the per-agent permit
  # policies (the folded-in cedar/*.cedar, rewritten to the gateway schema:
  # `<Target>___<tool>` actions, context.input.* conditions), confirming the
  # exact GitHub write-tool names in infra/dashboard/fleet_policy.py, and wiring
  # each agent's inbound auth to the Gateway (AWS_IAM / SigV4 via runtime role).

  FleetPolicyEngine:
    Type: AWS::BedrockAgentCore::PolicyEngine
    Condition: GatewayEnabled
    Properties:
      Name: !Sub sdlcFleet${Stage}
      Description: Cedar policy engine enforcing the SDLC agent fleet tool-call boundary
      Tags:
        - Key: Project
          Value: sdlc-agents

  # Gateway role — used by the gateway for outbound auth to the MCP targets.
  FleetGatewayRole:
    Type: AWS::IAM::Role
    Condition: GatewayEnabled
    Properties:
      RoleName: !Sub sdlc-fleet-gateway-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: mcp-token-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Outbound auth to the Asana target (still a direct McpServer). The
              # GitHub target is the SCM broker Lambda, which mints its OWN
              # per-owner App token — the gateway role holds no GitHub credential
              # (the shared PAT was retired).
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/asana-pat
        - PolicyName: invoke-scm-broker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # A Lambda gateway target is invoked with the GATEWAY's execution
              # role (identity-based), so the role needs lambda:InvokeFunction on
              # the broker — the resource-based ScmBrokerInvokePermission (service
              # principal) alone is NOT sufficient and target CREATE fails with
              # "Gateway execution role lacks permission to invoke Lambda".
              # Referenced by name (not !GetAtt ScmBrokerFunction.Arn) to avoid a
              # dependency cycle: the gateway takes this role, and the GitHub
              # target references both the gateway and the broker.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:scm-broker-${Stage}
        - PolicyName: policy-engine-eval
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Attaching the gateway to a policy engine requires the gateway's
              # own role to read that engine (CloudFormation calls GetPolicyEngine
              # with this role during gateway create) and to authorize actions
              # against it at runtime. Actions per the AgentCore "Gateway and
              # Policy IAM Permissions" doc (policy-permissions.html).
              - Sid: PolicyEngineConfiguration
                Effect: Allow
                Action: bedrock-agentcore:GetPolicyEngine
                Resource:
                  - !GetAtt FleetPolicyEngine.PolicyEngineArn
              - Sid: PolicyEngineAuthorization
                Effect: Allow
                Action:
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:PartiallyAuthorizeActions
                Resource:
                  - !GetAtt FleetPolicyEngine.PolicyEngineArn
                  # Gateway by account/region wildcard, NOT !GetAtt
                  # FleetGateway.GatewayArn — the gateway takes this role as its
                  # RoleArn, so referencing it here creates a CloudFormation
                  # dependency cycle. A name-prefixed pattern also fails: the
                  # service lowercases the gateway name into the id
                  # (sdlcFleetstaging -> sdlcfleetstaging-<suffix>) and IAM
                  # matching is case-sensitive. `gateway/*` (per the AgentCore IAM
                  # doc's own example) scopes to this account+region.
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*

  FleetGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Condition: GatewayEnabled
    Properties:
      Name: !Sub sdlcFleet${Stage}
      RoleArn: !GetAtt FleetGatewayRole.Arn
      Description: MCP gateway fronting GitHub/Asana for the SDLC agent fleet
      # Agents authenticate to the gateway with their AgentCore Runtime IAM role
      # (SigV4). No Cognito JWT minting in the agent path.
      AuthorizerType: AWS_IAM
      ProtocolType: MCP
      ProtocolConfiguration:
        Mcp:
          SupportedVersions:
            - "2025-06-18"
      # Attach the policy engine. Mode maps from GatewayPolicyEnforcement:
      # LOG_ONLY (default, safe rollout) or ENFORCE (blocks denied calls).
      PolicyEngineConfiguration:
        Arn: !GetAtt FleetPolicyEngine.PolicyEngineArn
        Mode: !If [GatewayEnforceActive, "ENFORCE", "LOG_ONLY"]
      # REQUEST interceptor: enforces per-origin co-repo grouping from the trusted
      # x-dispatch-origin header (passRequestHeaders lets it see the headers).
      # Runs before the broker; injects server-truth origin+agent into the call.
      InterceptorConfigurations:
        - InterceptionPoints:
            - REQUEST
          InputConfiguration:
            PassRequestHeaders: true
          Interceptor:
            Lambda:
              Arn: !GetAtt ScmInterceptorFunction.Arn
      Tags:
        Project: sdlc-agents

  # SCM broker Lambda — the GitHub tool target (spec §3.6). Replaces the direct
  # McpServer→api.githubcopilot.com target, which needed the retired shared PAT
  # on the gateway role. The broker mints a per-owner GitHub App installation
  # token per call (bounded to that owner's install — threat-model T-11) and
  # calls GitHub's REST API. Its Name stays "GitHubTarget" so the generated Cedar
  # action names (GitHubTarget___<tool>) and fleet_policy keep working unchanged.
  #
  # CredentialProviderConfigurations = GATEWAY_IAM_ROLE only (no outbound
  # OAuth/API-key provider on the target): the gateway invokes the Lambda with
  # its role; the Lambda itself reads the App key + mints tokens. Cedar still
  # evaluates every call, so the broker doesn't need the caller identity.
  #
  # ToolSchema.InlinePayload is the CURATED tool set (what the agents' Cedar
  # grants use — fleet_policy.AGENT_TOOL_GRANTS/WRITE_TOOLS), NOT the full GitHub
  # MCP surface, and NO destructive tools. Generated from scm_broker.tool_
  # definitions(); infra/dispatch/tests/test_scm_broker.py asserts this inline
  # copy matches, so regenerate it (python infra/dispatch/scm_broker.py) if the
  # broker's tool set changes.
  ScmBrokerFunction:
    Type: AWS::Serverless::Function
    Condition: GatewayEnabled
    # cryptography (github_app signs App JWTs) is a native wheel — build for the
    # Lambda target, not the build host (same reason as DashboardAdminFunction).
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub scm-broker-${Stage}
      CodeUri: ../dispatch/
      Handler: scm_broker.handler
      Timeout: 30
      Environment:
        Variables:
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          GITHUB_APP_ID_PARAM: !Ref GitHubAppIdParam
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKey
      Policies:
        # Mint per-owner GitHub App installation tokens: read the App private key
        # + app-id, and the per-owner install record from the fleet-config table.
        - DynamoDBReadPolicy:
            TableName: !Ref FleetConfigTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubAppPrivateKey
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlc-agents/${Stage}/github-app-id

  # The gateway invokes the broker; allow it (bedrock-agentcore) to call the fn.
  ScmBrokerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: GatewayEnabled
    Properties:
      FunctionName: !Ref ScmBrokerFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceArn: !GetAtt FleetGateway.GatewayArn

  # SCM co-repo REQUEST interceptor — runs at the gateway BEFORE the broker (and
  # before Cedar's target authorization). Reads the trusted x-dispatch-origin
  # header the agent stamps, enforces per-origin co-repo grouping (which OTHER
  # repos a dispatch may act on — a rule Cedar can't express because its principal
  # is the agent role, identical across dispatches), and injects the server-truth
  # origin+agent into the tool args so the broker scopes the credential from those,
  # not from anything the model set. See infra/dispatch/scm_interceptor.py.
  ScmInterceptorFunction:
    Type: AWS::Serverless::Function
    Condition: GatewayEnabled
    Properties:
      FunctionName: !Sub scm-interceptor-${Stage}
      CodeUri: ../dispatch/
      Handler: scm_interceptor.handler
      Timeout: 15
      Environment:
        Variables:
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
      Policies:
        # Resolve coreachable_repos(origin) from the fleet-config table.
        - DynamoDBReadPolicy:
            TableName: !Ref FleetConfigTable

  ScmInterceptorInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: GatewayEnabled
    Properties:
      FunctionName: !Ref ScmInterceptorFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      # The gateway references this interceptor (InterceptorConfigurations), so
      # SourceArn must NOT be !GetAtt FleetGateway.GatewayArn — that would be a
      # dependency cycle. Scope to the fleet gateway by account/region pattern
      # (same approach the gateway role uses for the same reason).
      SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*

  # GitHub tool target — the "<TargetName>" (GitHubTarget) that prefixes the
  # generated Cedar action names. Must match fleet_policy.GITHUB_TARGET.
  GitHubGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: GatewayEnabled
    Properties:
      GatewayIdentifier: !GetAtt FleetGateway.GatewayIdentifier
      Name: GitHubTarget
      Description: GitHub tools via the SCM broker (per-owner GitHub App tokens)
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt ScmBrokerFunction.Arn
            ToolSchema:
              InlinePayload:
              - Name: add_issue_comment
                Description: GitHub add issue comment (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    body:
                      Type: string
                    issue_number:
                      Type: integer
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [body, issue_number, owner, repo]
              - Name: add_labels_to_issue
                Description: GitHub add labels to issue (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    issue_number:
                      Type: integer
                    labels:
                      Type: array
                      Items:
                        Type: string
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [issue_number, labels, owner, repo]
              - Name: create_branch
                Description: GitHub create branch (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    branch:
                      Type: string
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [branch, owner, repo]
              - Name: create_issue
                Description: GitHub create issue (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    repo:
                      Type: string
                    title:
                      Type: string
                  Required: [owner, repo, title]
              - Name: create_or_update_file
                Description: GitHub create or update file (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    content:
                      Type: string
                    message:
                      Type: string
                    owner:
                      Type: string
                    path:
                      Type: string
                    repo:
                      Type: string
                  Required: [content, message, owner, path, repo]
              - Name: create_pull_request
                Description: GitHub create pull request (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    base:
                      Type: string
                    head:
                      Type: string
                    owner:
                      Type: string
                    repo:
                      Type: string
                    title:
                      Type: string
                  Required: [base, head, owner, repo, title]
              - Name: create_pull_request_review
                Description: GitHub create pull request review (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    pull_number:
                      Type: integer
                    repo:
                      Type: string
                  Required: [owner, pull_number, repo]
              - Name: get_file_contents
                Description: GitHub get file contents (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    path:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, path, repo]
              - Name: get_issue
                Description: GitHub get issue (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    issue_number:
                      Type: integer
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [issue_number, owner, repo]
              - Name: get_pull_request
                Description: GitHub get pull request (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    pull_number:
                      Type: integer
                    repo:
                      Type: string
                  Required: [owner, pull_number, repo]
              - Name: get_pull_request_diff
                Description: GitHub get pull request diff (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    pull_number:
                      Type: integer
                    repo:
                      Type: string
                  Required: [owner, pull_number, repo]
              - Name: list_commits
                Description: GitHub list commits (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, repo]
              - Name: list_issues
                Description: GitHub list issues (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, repo]
              - Name: list_milestones
                Description: GitHub list milestones (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, repo]
              - Name: list_pull_request_files
                Description: GitHub list pull request files (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    pull_number:
                      Type: integer
                    repo:
                      Type: string
                  Required: [owner, pull_number, repo]
              - Name: list_pull_requests
                Description: GitHub list pull requests (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, repo]
              - Name: push_files
                Description: GitHub push files (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    branch:
                      Type: string
                    files:
                      Type: array
                      Items:
                        Type: object
                        Properties:
                          path:
                            Type: string
                          content:
                            Type: string
                        Required: [path, content]
                    message:
                      Type: string
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [branch, files, message, owner, repo]
              - Name: search_code
                Description: GitHub search code (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    owner:
                      Type: string
                    query:
                      Type: string
                    repo:
                      Type: string
                  Required: [owner, query, repo]
              - Name: update_issue
                Description: GitHub update issue (per-owner App token).
                InputSchema:
                  Type: object
                  Properties:
                    issue_number:
                      Type: integer
                    owner:
                      Type: string
                    repo:
                      Type: string
                  Required: [issue_number, owner, repo]

  AsanaGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: GatewayEnabled
    Properties:
      GatewayIdentifier: !GetAtt FleetGateway.GatewayIdentifier
      Name: AsanaTarget
      Description: Asana official MCP server
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref AsanaMcpEndpoint
            ListingMode: DYNAMIC

  # --- SPA hosting: private S3 + CloudFront (OAC) ----------------------------
  # The built SPA is uploaded to a private bucket (account Block Public Access
  # stays on, consistent with the artifacts/logs buckets) and served only
  # through CloudFront via Origin Access Control. The deploy workflow
  # (.github/workflows/deploy-dashboard.yml) syncs dist/ and writes config.json.

  DashboardSiteBucket:
    Type: AWS::S3::Bucket
    Condition: DashboardEnabled
    Properties:
      BucketName: !Sub sdlc-agent-dashboard-${AWS::AccountId}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: sdlc-agents

  # Grants the CloudFront distribution (and only it) read access to the private
  # bucket, scoped by the distribution ARN via the OAC service principal.
  DashboardSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DashboardEnabled
    Properties:
      Bucket: !Ref DashboardSiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${DashboardSiteBucket.Arn}/*
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: DashboardEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub sdlc-agents-dashboard-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DashboardEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub SDLC Agent Fleet dashboard (${Stage})
        DefaultRootObject: index.html
        HttpVersion: http2
        # SPA client-side routing / deep links: a request for a path the bucket
        # doesn't have (e.g. after the OIDC redirect) must serve index.html so
        # the app boots and handles the route, rather than CloudFront 403/404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: DashboardS3Origin
            DomainName: !GetAtt DashboardSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DashboardS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" cache policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

Outputs:
  AssignmentsTableName:
    Value: !Ref AssignmentsTable
    Export:
      Name: !Sub ${AWS::StackName}-AssignmentsTable

  # Consumed by deploy-agent.yml to set the GitHub App env on agent runtimes.
  # All three are unconditional: the App credential resources exist regardless of
  # the dashboard (agents + reply Lambda mint tokens from them), and the
  # fleet-config table holds the per-owner install records.
  FleetConfigTableName:
    Value: !Ref FleetConfigTable
    Export:
      Name: !Sub ${AWS::StackName}-FleetConfigTable

  GitHubAppIdParamName:
    Value: !Ref GitHubAppIdParam

  GitHubAppPrivateKeySecretArn:
    Value: !Ref GitHubAppPrivateKey

  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub ${AWS::StackName}-ArtifactsBucket

  DispatchRouterArn:
    Value: !GetAtt DispatchRouterFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DispatchRouterArn

  WebhookEndpoint:
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/asana/webhook
    Description: Asana webhook URL — register this in Asana webhook subscriptions

  WebhookApiId:
    Value: !Ref WebhookApi
    Export:
      Name: !Sub ${AWS::StackName}-WebhookApiId

  GuardrailId:
    Value: !Ref PromptInjectionGuardrail
    Description: Bedrock Guardrail ID — referenced by Router env and agent runtimes
    Export:
      Name: !Sub ${AWS::StackName}-GuardrailId

  GuardrailArn:
    Value: !GetAtt PromptInjectionGuardrail.GuardrailArn
    Description: Bedrock Guardrail ARN — used for IAM policies in agent runtime roles
    Export:
      Name: !Sub ${AWS::StackName}-GuardrailArn

  GuardrailVersion:
    Value: DRAFT
    Description: Guardrail version referenced by Router and agents. Bump explicitly to pin a published version.
    Export:
      Name: !Sub ${AWS::StackName}-GuardrailVersion

  # --- Dashboard (only present when DeployDashboard=true) --------------------

  DashboardApiEndpoint:
    Condition: DashboardEnabled
    Value: !Sub https://${DashboardApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Description: Base URL of the dashboard query API (SPA config apiBaseUrl)

  DashboardUserPoolId:
    Condition: DashboardEnabled
    Value: !Ref DashboardUserPool
    Description: Cognito user pool id for the dashboard SPA

  DashboardUserPoolClientId:
    Condition: DashboardEnabled
    Value: !Ref DashboardUserPoolClient
    Description: Cognito app client id for the dashboard SPA (public, PKCE)

  DashboardLoginDomain:
    Condition: DashboardEnabled
    # Reference the domain resource (its Ref is the prefix) rather than
    # re-deriving the literal, so this can't drift from the Domain property.
    Value: !Sub https://${DashboardUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
    Description: Cognito Hosted UI domain for operator login

  DashboardUrl:
    Condition: DashboardEnabled
    Value: !Sub https://${DashboardDistribution.DomainName}/
    Description: CloudFront URL of the fleet dashboard — the operator entry point

  DashboardSiteBucketName:
    Condition: DashboardEnabled
    Value: !Ref DashboardSiteBucket
    Description: S3 bucket the deploy workflow syncs the built SPA into

  DashboardDistributionId:
    Condition: DashboardEnabled
    Value: !Ref DashboardDistribution
    Description: CloudFront distribution id — used to invalidate the cache on deploy

  CapabilitySourceBucketName:
    Condition: DashboardEnabled
    Value: !Ref CapabilitySourceBucket
    Description: S3 bucket the base deploy uploads the fleet source (source.zip) into for the build pipeline

  # --- Gateway (only present when DeployGateway=true) ------------------------

  FleetGatewayUrl:
    Condition: GatewayEnabled
    Value: !GetAtt FleetGateway.GatewayUrl
    Description: MCP gateway URL — set as GATEWAY_MCP_URL on the agent runtimes to route tools through the policy engine
    Export:
      Name: !Sub ${AWS::StackName}-FleetGatewayUrl

  FleetPolicyEngineId:
    Condition: GatewayEnabled
    Value: !GetAtt FleetPolicyEngine.PolicyEngineId
    Description: Policy engine id the admin Lambda syncs the fleet Cedar policy into
