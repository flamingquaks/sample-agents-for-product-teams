# Slack App Manifest for SDLC Agent Fleet
#
# Use this manifest to create the Slack app via api.slack.com/apps or
# programmatically via apps.manifest.create.
#
# Replace <EVENTS_URL> with your deployed API Gateway endpoint:
#   https://<api-id>.execute-api.<region>.amazonaws.com/<stage>/slack/events
# Replace <SLASH_URL> with:
#   https://<api-id>.execute-api.<region>.amazonaws.com/<stage>/slack/slash

display_information:
  name: SDLC Agent Fleet
  # description must be <= 140 chars (Slack manifest limit). The fuller pitch
  # lives in long_description below.
  description: Autonomous AI agents for the software development lifecycle — PM, research, docs, and architecture decisions.
  background_color: "#1a1a2e"
  long_description: |
    The SDLC Agent Fleet plants an autonomous AI agent in each role's seat so
    operational work (decomposition, status, docs, ADR tagging) runs itself and
    humans stay focused on the product.

    Available agents:
    - Workitems: PO/PM — work decomposition, status reports, risk detection
    - Researcher: Business analyst — research synthesis, competitive intel
    - Docwriter: Technical writer — API docs, user guides, release notes
    - Adr: ADR linker — tags issues and reviews PRs against architecture decisions

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: SDLC Agents
    always_online: true
  # The AI Assistant surface. The manifest key is `assistant_view` — this is the
  # surface that pairs with the `assistant:write` scope and the
  # `assistant_thread_started` event + assistant.threads.* APIs the receiver
  # uses (see process_assistant_thread_started in infra/dispatch/slack_events.py).
  # NOT `agent_view` (that's a different container that rejects assistant:write
  # and needs separate enablement) and NOT `assistant` (invalid key).
  # suggested_prompts is an array of {title, message}; the receiver may also
  # refresh them per-thread at runtime, but declaring defaults here gives users
  # prompts on first open.
  assistant_view:
    assistant_description: PM, research, documentation, and architecture-decision agents for your software lifecycle.
    suggested_prompts:
      - title: Sprint Status
        message: Generate a status report for the current sprint
      - title: Risk Scan
        message: Detect risks and blockers in active work
      - title: Research Topic
        message: "@researcher analyze competitive landscape for [topic]"
      - title: Generate Docs
        message: "@docwriter generate release notes for the latest changes"
  slash_commands:
    - command: /workitems
      description: Invoke the Workitems agent (PO/PM)
      url: <SLASH_URL>
      usage_hint: "[instruction] — e.g., generate a status report"
      should_escape: false
    - command: /researcher
      description: Invoke the Researcher agent (Business analyst)
      url: <SLASH_URL>
      usage_hint: "[instruction] — e.g., analyze competitors for [topic]"
      should_escape: false
    - command: /docwriter
      description: Invoke the Docwriter agent (Technical writer)
      url: <SLASH_URL>
      usage_hint: "[instruction] — e.g., generate release notes"
      should_escape: false
    - command: /adr
      description: Invoke the ADR agent (Architecture decisions)
      url: <SLASH_URL>
      usage_hint: "[instruction] — e.g., review PR #42 against ADRs"
      should_escape: false
    - command: /fleet
      description: Fleet management and status
      url: <SLASH_URL>
      usage_hint: "status | health | budget [agent]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - chat:write
      # chat:write.public is intentionally NOT requested. It would let the bot
      # post to ANY public channel without being a member — and since the
      # agent's slack_post_message tool takes an arbitrary channel_id, a
      # prompt-injected agent could exfiltrate context to a channel it was never
      # invited to (widens threat T-15). With chat:write alone the bot can only
      # post to channels it has been added to. If you have a concrete need to
      # post to un-joined public channels, add `chat:write.public` here and
      # document it as an accepted T-15 widening.
      - commands
      - im:history
      - im:read
      - im:write
      - reactions:read
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    request_url: <EVENTS_URL>
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_started
      - message.im
  # Interactivity is disabled: the fleet uses no block buttons / modals yet, and
  # the receiver has no interactive-payload handler (a form-encoded interaction
  # POST would fall into the slash-command path and return "Unknown command").
  # Enable this + add a /slack/interactions handler when block actions are added.
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
