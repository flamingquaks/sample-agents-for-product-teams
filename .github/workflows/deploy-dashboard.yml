# Build the fleet dashboard SPA and publish it to S3 + CloudFront.
#
# Runs on pushes to main that touch dashboard/ (or on manual dispatch). Reads
# the foundation stack's dashboard outputs to (a) generate the SPA's runtime
# config.json and (b) locate the site bucket + distribution, then uploads the
# built assets and invalidates the CloudFront cache.
#
# No-op-safe: if the foundation stack was deployed with DeployDashboard=false
# (the default), the dashboard outputs are absent and the job exits early with a
# clear message rather than failing.

name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  STAGE: dev

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read dashboard outputs from foundation stack
        id: outputs
        run: |
          STACK_NAME="sdlc-agents-${STAGE}"
          get() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text 2>/dev/null || echo "None"
          }
          BUCKET=$(get DashboardSiteBucketName)
          if [ "${BUCKET}" = "None" ] || [ -z "${BUCKET}" ]; then
            echo "::notice::Dashboard is not enabled on stack ${STACK_NAME} (deploy the foundation stack with DeployDashboard=true to publish the SPA). Skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "bucket=${BUCKET}"
            echo "distribution=$(get DashboardDistributionId)"
            echo "api=$(get DashboardApiEndpoint)"
            echo "pool=$(get DashboardUserPoolId)"
            echo "client=$(get DashboardUserPoolClientId)"
            echo "login=$(get DashboardLoginDomain)"
            echo "url=$(get DashboardUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.outputs.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build SPA
        if: steps.outputs.outputs.enabled == 'true'
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Generate config.json from stack outputs
        if: steps.outputs.outputs.enabled == 'true'
        working-directory: dashboard
        env:
          API: ${{ steps.outputs.outputs.api }}
          POOL: ${{ steps.outputs.outputs.pool }}
          CLIENT: ${{ steps.outputs.outputs.client }}
          LOGIN: ${{ steps.outputs.outputs.login }}
          URL: ${{ steps.outputs.outputs.url }}
        run: |
          # The OIDC authority is the user pool's issuer URL.
          AUTHORITY="https://cognito-idp.${AWS_REGION}.amazonaws.com/${POOL}"
          # Written next to index.html; the SPA fetches it base-relative at startup.
          cat > dist/config.json <<JSON
          {
            "apiBaseUrl": "${API}",
            "cognitoAuthority": "${AUTHORITY}",
            "cognitoClientId": "${CLIENT}",
            "cognitoLoginDomain": "${LOGIN}",
            "redirectUri": "${URL}"
          }
          JSON
          echo "--- config.json ---"; cat dist/config.json

      - name: Upload to S3
        if: steps.outputs.outputs.enabled == 'true'
        working-directory: dashboard
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          # Hashed asset files (assets/*) are immutable → cache forever. Sync
          # them with --delete to prune old builds, but exclude the two files
          # that must never be served stale (index.html, config.json) so the
          # sync neither long-caches nor deletes them; upload those separately
          # with no-cache.
          aws s3 sync dist/ "s3://${BUCKET}/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html --exclude config.json
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache"
          aws s3 cp dist/config.json "s3://${BUCKET}/config.json" \
            --cache-control "no-cache" --content-type application/json

      - name: Invalidate CloudFront
        if: steps.outputs.outputs.enabled == 'true'
        env:
          DIST: ${{ steps.outputs.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/*"
          echo "Published: ${{ steps.outputs.outputs.url }}"
