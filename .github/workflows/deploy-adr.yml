name: Deploy Adr Agent

# Adr is GitHub-only and multi-repo: the repo it acts on comes from the dispatch
# (source_context.repo) per invocation, not a deploy-time variable. It reads no
# Asana config, so it needs no agent-specific env vars — the shared pipeline
# still injects the Bedrock guardrail env from the foundation stack.

on:
  push:
    branches: [main]
    paths:
      - "agents/adr/**"
      - "agents/shared/**"

permissions:
  contents: read
  id-token: write    # required so the reusable callee (deploy-agent.yml) can assume the OIDC deploy role

jobs:
  deploy:
    uses: ./.github/workflows/deploy-agent.yml
    with:
      agent_name: adr
    secrets: inherit
